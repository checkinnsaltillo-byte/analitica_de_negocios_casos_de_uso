<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Versión del expositor · Estadística para comunicar decisiones</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b1020;color:#e5ecf8;font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:#7dd3fc}
.top{display:flex;align-items:center;gap:14px;padding:8px 16px;border-bottom:1px solid #1e293b;background:#0e1428;flex-wrap:wrap}
.top h1{margin:0;font-size:14px;font-weight:600;letter-spacing:.02em}.top h1 small{display:block;font-weight:400;font-size:11px;color:#94a3b8}
.sp{flex:1}
.tm{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}.tm b{font-size:18px;font-weight:600}.tm span{font-size:11px;color:#94a3b8}
.tm.late b{color:#f87171}.tm.ok b{color:#4ade80}
button{font:inherit;color:inherit;background:#17203b;border:1px solid #2a3556;border-radius:8px;padding:5px 11px;cursor:pointer}button:hover{background:#1f2b4d}button.pri{background:#4f46e5;border-color:#6366f1}
.bar{height:4px;background:#17203b;position:relative}.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#6366f1,#2dd4bf)}
.main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);height:calc(100% - 52px - 4px)}
.deck{padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0}
.frame{position:relative;width:100%;aspect-ratio:16/9;max-height:calc(100% - 52px);margin:0 auto;border-radius:12px;overflow:hidden;border:1px solid #243052;background:#000}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ctl{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap}
.ctl .num{min-width:92px;text-align:center;font-variant-numeric:tabular-nums;color:#cbd5e1}
.ctl input{width:58px;background:#0e1428;border:1px solid #2a3556;border-radius:8px;color:inherit;padding:5px 7px;text-align:center}
.notes{border-left:1px solid #1e293b;padding:14px 18px 40px;overflow:auto;min-height:0}
.blk{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#7dd3fc}
.notes h2{margin:2px 0 12px;font-size:19px;line-height:1.25}
.sec{margin:0 0 14px;padding:11px 13px;border-radius:10px;border:1px solid #243052;background:#101833}
.sec h3{margin:0 0 6px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#94a3b8;font-weight:600}
.sec ul{margin:0;padding-left:18px}.sec li{margin:0 0 6px}
.sec.m{border-color:#4338ca;background:#131a3f}.sec.m h3{color:#a5b4fc}
.sec.c{border-color:#115e59;background:#0d2230}.sec.c h3{color:#5eead4}
.sec.p{border-color:#a16207;background:#231d10}.sec.p h3{color:#fcd34d}
.sec.t h3{color:#cbd5e1}
.oc{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:99px;background:#7f1d1d;color:#fecaca;font-size:10px;letter-spacing:.05em;vertical-align:middle}
.empty{color:#94a3b8}
.all{display:none;padding:18px 24px 60px;max-width:980px;margin:0 auto}
body.todas .main{display:none}body.todas .all{display:block}body.todas html{overflow:auto}
.all article{break-inside:avoid;margin:0 0 18px;padding:12px 14px;border:1px solid #243052;border-radius:10px;background:#101833}
.all article h2{margin:0 0 6px;font-size:16px}.all article h2 span{color:#7dd3fc;margin-right:8px}
.all .blkh{margin:26px 0 10px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#7dd3fc;border-bottom:1px solid #243052;padding-bottom:4px}
.all ul{margin:4px 0 6px;padding-left:18px}.all p{margin:4px 0}
body.todas{overflow:auto;height:auto}
@media (max-width:900px){.main{grid-template-columns:1fr;height:auto}.frame{max-height:none}.notes{border-left:0;border-top:1px solid #1e293b}}
@media print{.top,.bar{display:none}body{background:#fff;color:#000}.all article{background:#fff;border-color:#999}.all .blkh{color:#000}}
</style>
</head>
<body>
<div class="top">
  <h1>Versión del expositor<small>Estadística para comunicar decisiones · notas, curiosidades y recordatorios</small></h1>
  <span class="sp"></span>
  <div class="tm" id="tm" title="Tiempo transcurrido / objetivo acumulado hasta el final de este bloque"><b id="tmv">00:00</b><span id="tmo"></span><button id="tmb" type="button">Iniciar</button><button id="tmr" type="button" title="Reiniciar cronómetro">↺</button></div>
  <button id="vtodas" type="button">Ver todas las notas</button>
  <a href="index.html#1" target="_blank" rel="noopener">Presentación sin notas ↗</a>
</div>
<div class="bar"><i id="pg" style="width:0"></i></div>
<div class="main">
  <div class="deck">
    <div class="frame"><iframe id="fr" src="index.html#1" title="Presentación" allow="fullscreen"></iframe></div>
    <div class="ctl"><button id="prev" type="button">← Anterior</button><span class="num" id="num">1 / 65</span><input id="goto" type="number" min="1" max="65" placeholder="ir a…" aria-label="Ir a lámina"><button id="next" type="button" class="pri">Siguiente →</button></div>
  </div>
  <aside class="notes" id="notes"></aside>
</div>
<div class="all" id="all"></div>
<script src="notas.js"></script>
<script>
(function(){
var fr=document.getElementById('fr'),N=65,HID={23:1,43:1,63:1},cur=1,titles={};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function bloque(n){var B=window.BLOQUES,i;for(i=0;i<B.length;i++)if(n>=B[i].d&&n<=B[i].h)return i;return 0;}
function objetivo(n){var B=window.BLOQUES,i=bloque(n),fin=B[i].min+(i>0?0:0);var a=0,k;for(k=0;k<=i;k++)a+=B[k].min;return a;}
function nota(n){var x=window.NOTAS[n]||{};return{m:x.m||[],c:x.c||'',p:x.p||'',t:x.t||''};}
function html(n){
  var x=nota(n),b=window.BLOQUES[bloque(n)],ti=titles[n]||'',oc=HID[n]?'<span class="oc">OCULTA · se salta al avanzar</span>':'';
  return '<div class="blk">'+esc(b.n)+' · lámina '+n+' de '+N+'</div><h2>'+esc(ti||('Lámina '+n))+oc+'</h2>'
   +(x.m.length?'<div class="sec m"><h3>No olvides mencionar</h3><ul>'+x.m.map(function(t){return'<li>'+esc(t)+'</li>';}).join('')+'</ul></div>':'<div class="sec"><p class="empty">Sin notas para esta lámina.</p></div>')
   +(x.c?'<div class="sec c"><h3>Curiosidad o dato complementario</h3>'+esc(x.c)+'</div>':'')
   +(x.p?'<div class="sec p"><h3>Pregunta para el grupo</h3>'+esc(x.p)+'</div>':'')
   +(x.t?'<div class="sec t"><h3>Transición</h3>'+esc(x.t)+'</div>':'');
}
function pinta(){
  document.getElementById('notes').innerHTML=html(cur);document.getElementById('notes').scrollTop=0;
  document.getElementById('num').textContent=cur+' / '+N;document.getElementById('pg').style.width=(cur/N*100)+'%';
  document.getElementById('tmo').textContent='objetivo ≤ '+objetivo(cur)+' min';tick();
}
function titulos(){try{var d=fr.contentDocument;if(!d)return;[].forEach.call(d.querySelectorAll('section.slide'),function(s,i){titles[i+1]=s.getAttribute('data-title')||'';});}catch(e){}}
function ir(n){n=Math.max(1,Math.min(N,n));try{fr.contentWindow.location.hash='#'+n;}catch(e){fr.src='index.html#'+n;}if(n!==cur){cur=n;pinta();}}
function paso(d){var j=cur+d;while(j>=1&&j<=N&&HID[j])j+=d;if(j>=1&&j<=N)ir(j);}
function lee(){try{var h=parseInt(fr.contentWindow.location.hash.slice(1),10);if(!isNaN(h)&&h>=1&&h<=N&&h!==cur){cur=h;pinta();}}catch(e){}}
fr.addEventListener('load',function(){titulos();lee();pinta();});
setInterval(lee,250);
document.getElementById('prev').onclick=function(){paso(-1);};document.getElementById('next').onclick=function(){paso(1);};
document.getElementById('goto').onkeydown=function(e){if(e.key==='Enter'){ir(parseInt(this.value,10)||cur);this.value='';this.blur();}e.stopPropagation();};
addEventListener('keydown',function(e){if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();paso(1);}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();paso(-1);}});
/* cronómetro */
var t0=0,acum=0,corre=false;
function seg(){return acum+(corre?(Date.now()-t0)/1000:0);}
function fmt(s){s=Math.floor(s);var m=Math.floor(s/60);return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function tick(){var s=seg(),o=objetivo(cur)*60,el=document.getElementById('tm');document.getElementById('tmv').textContent=fmt(s);el.classList.toggle('late',corre&&s>o+60);el.classList.toggle('ok',corre&&s<=o+60&&s>0);}
document.getElementById('tmb').onclick=function(){if(corre){acum=seg();corre=false;this.textContent='Reanudar';}else{t0=Date.now();corre=true;this.textContent='Pausar';}tick();};
document.getElementById('tmr').onclick=function(){acum=0;corre=false;document.getElementById('tmb').textContent='Iniciar';tick();};
setInterval(tick,1000);
/* todas las notas (imprimible) */
function todas(){
  titulos();var out='<h1 style="font-size:20px;margin:0 0 4px">Notas del expositor</h1><p style="color:#94a3b8;margin:0 0 10px">Estadística para comunicar decisiones · '+N+' láminas · 60 minutos. Usa Imprimir del navegador para guardarlo en PDF.</p>',b=-1,n;
  for(n=1;n<=N;n++){var k=bloque(n);if(k!==b){b=k;out+='<div class="blkh">'+esc(window.BLOQUES[k].n)+' · '+window.BLOQUES[k].min+' min</div>';}
    var x=nota(n);out+='<article><h2><span>'+n+'</span>'+esc(titles[n]||'')+(HID[n]?'<span class="oc">OCULTA</span>':'')+'</h2>'
      +(x.m.length?'<ul>'+x.m.map(function(t){return'<li>'+esc(t)+'</li>';}).join('')+'</ul>':'')
      +(x.c?'<p><b style="color:#5eead4">Curiosidad:</b> '+esc(x.c)+'</p>':'')+(x.p?'<p><b style="color:#fcd34d">Pregunta:</b> '+esc(x.p)+'</p>':'')+(x.t?'<p><b>Transición:</b> '+esc(x.t)+'</p>':'')+'</article>';}
  document.getElementById('all').innerHTML=out;
}
document.getElementById('vtodas').onclick=function(){var on=document.body.classList.toggle('todas');this.textContent=on?'Volver a la presentación':'Ver todas las notas';if(on)todas();};
var h0=parseInt(location.hash.slice(1),10);if(h0>=1&&h0<=N){cur=h0;fr.src='index.html#'+h0;}
pinta();
})();
</script>
</body>
</html>
